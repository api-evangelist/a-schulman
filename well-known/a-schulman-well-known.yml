description: >-
  A. Schulman was acquired by LyondellBasell in 2018 and the brand was absorbed into the
  Advanced Polymer Solutions division. The legacy aschulman.com domain still resolves
  (165.249.0.58, Azure DNS) but serves an IIS "Not Found" page over plain HTTP and does not
  complete a TLS handshake at all. No /.well-known/ document was served by any host probed.
notes: >-
  EVERY path 404d (or 500d on the customer portal). No WellKnown, SecurityTxt, APICatalog or
  AgentCard pointer is emitted in apis.yml, because a recorded absence is not a presence.
  The lyb.customerxpress.com host answers 500 for every /.well-known/* path rather than 404,
  which is an application error page, not a served document.
